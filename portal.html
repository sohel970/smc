function calcDues(d){
  if(!d.paid||!d.start) return d.dues||[];
  const now=new Date(), cm=now.getFullYear()*12+now.getMonth(), [sy,sm]=d.start.split('-').map(Number), out=[];
  for(let m=Math.max(sy*12+sm-1,cm-11);m<=cm;m++){ const y=Math.floor(m/12), mi=m%12, paid=d.paid[y+'-'+String(mi+1).padStart(2,'0')]||0, due=(d.fee||0)-paid;
    if(due>0&&(m===cm||paid>0)) out.push({m:MON[mi],y,due}); }
  return out;
}
const paidOf=(y,mi)=>(D.paid||{})[y+'-'+String(mi+1).padStart(2,'0')]||0;

  slip({rcpt:r.rcpt,date:r.payDate,name:D.name,id:D.id,cls:D.cls,desc:`${r.type||'Monthly Fee'} – ${r.month} ${r.year}`,method:r.method,trx:r.trx,amount:r.amount}); };
$('hist').onclick=e=>{ const b=e.target.closest('button[data-h]'); if(!b) return; const p=D.payments[+b.dataset.h];
  slip({rcpt:p.rcpt,date:p.date,name:D.name,id:D.id,cls:D.cls,desc:p.type+(p.month&&p.month!=='-'?` – ${p.month} ${p.year}`:''),method:p.method,trx:p.trx,amount:p.amount}); };
applyLang();
try{ const s=JSON.parse(sessionStorage.getItem('smc-p')||'null'); if(s) enter(s.id,s.ph); }catch(e){}
</script>
