const loc = p => { let d=String(p||'').replace(/\D/g,''); if(d.startsWith('880')) d=d.slice(2); if(d.length===10&&d[0]==='1') d='0'+d; return d; };
const ICON={users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',check:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',phone:'<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/>',bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/>'};

let L='bn'; try{ L=localStorage.getItem('smc-lang')||'bn'; }catch(e){}
const i=L=>L==='en'?1:0;
const t=k=>T[k]?T[k][i(L)]:k, P=a=>a[i(L)];
let NOTICES=[], FIRST=true;
const tel='tel:'+SITE.phone, wa='https://wa.me/88'+loc(SITE.phone);

function render(){
  const en=L==='en'; document.documentElement.lang=L; document.title=en?'Sohel Math Care – Where Logic Meets Success':'Sohel Math Care – বুঝে শেখা গণিত';
  document.querySelectorAll('[data-t]').forEach(el=>{ const k=el.dataset.t; el.innerHTML=k==='eyebrow'?P(SITE.eyebrow):t(k); });
  $('lang_btn').textContent=en?'বাং':'EN'; $('dr_lang').textContent=en?'বাংলায় দেখুন':'View in English';
  const c=FIRST?'rv':'rv in';
  $('course_grid').innerHTML=SITE.courses.map(x=>`<article class="card course ${c}"><span class="badge">${esc(P(x.badge))}</span><h3>${esc(P(x.title))}</h3><ul>${x.points.map(p=>`<li>${esc(P(p))}</li>`).join('')}</ul><button class="btn b-d sm" data-c="${x.cls}">${t('enroll')}</button></article>`).join('');
  $('why_grid').innerHTML=SITE.why.map(w=>`<div class="card ${c}"><div class="ico"><svg viewBox="0 0 24 24">${ICON[w.i]||ICON.check}</svg></div><h3>${esc(P(w.t))}</h3><p>${esc(P(w.d))}</p></div>`).join('');
  $('faq_list').innerHTML=SITE.faqs.map(f=>`<details><summary>${esc(P(f[0]))}</summary><p>${esc(P(f[1]))}</p></details>`).join('');
  if(SITE.stats.show){ $('stats').hidden=false; $('stats_g').innerHTML=SITE.stats.items.map(s=>`<div class="stat"><b>${esc(P(s[0]))}</b><span>${esc(P(s[1]))}</span></div>`).join(''); }
  if(SITE.results.show){ $('results').hidden=false; $('res_grid').innerHTML=SITE.results.items.map(r=>`<div class="card quote ${c}"><div class="ico"><svg viewBox="0 0 24 24"><path d="M12 15a6 6 0 1 0 0-12 6 6 0 0 0 0 12z"/><path d="M8.2 13.9L7 23l5-3 5 3-1.2-9.1"/></svg></div><b>${esc(P(r[0]))}</b><small>${esc(P(r[1]))}</small></div>`).join(''); }
  const v=$('a_cls').value; $('a_cls').innerHTML=`<option value="">${t('f_sel')}</option>`+[...Array(12)].map((_,n)=>`<option value="${n+1}">${en?'Class ':'ক্লাস '}${n+1}</option>`).join(''); $('a_cls').value=v;
  $('addr').textContent=P(SITE.address); $('c3t').innerHTML=esc(P(SITE.address))+'<br>'+esc(P(SITE.hours)); $('call_hours').textContent=P(SITE.hours); $('f_hours').textContent=P(SITE.hours);
  $('f_tel').textContent=(en?'Phone: ':'ফোন: ')+SITE.phone;
  const n=NOTICES.map(x=>{ const p=x.split('||'); return (en&&p[1]?p[1]:p[0]).trim(); }).filter(Boolean);
  if(n.length){ $('top_text').textContent=n.join('  •  '); $('top_notice').hidden=false; }
  FIRST=false;
}
['nav_call','dr_call','call_btn','m_call','f_tel','c1','ab_call'].forEach(x=>$(x).href=tel);
['nav_tel','call_tel','c1t'].forEach(x=>$(x).textContent=SITE.phone);
['call_wa','f_wa','m_wa','c2','ab_wa','fab'].forEach(x=>$(x).href=wa); $('c2t').textContent=SITE.phone;
if(SITE.facebook){ $('call_fb').href=SITE.facebook; $('call_fb').hidden=false; }
if(SITE.map) $('c3').href=SITE.map; else $('c3').removeAttribute('href');
$('yr').textContent=new Date().getFullYear();
$('f_img').onerror=()=>{ $('f_img').style.visibility='hidden'; };
render();
const setLang=()=>{ L=L==='en'?'bn':'en'; try{ localStorage.setItem('smc-lang',L); }catch(e){} render(); };
$('lang_btn').onclick=setLang; $('dr_lang').onclick=()=>{ setLang(); closeDr(); };

$('course_grid').onclick=e=>{ const b=e.target.closest('button[data-c]'); if(!b) return; $('a_cls').value=b.dataset.c; $('admission').scrollIntoView(); setTimeout(()=>$('a_name').focus({preventScroll:true}),500); };
const dd=$('dd'); $('dd_btn').onclick=e=>{ e.stopPropagation(); const o=dd.classList.toggle('open'); $('dd_btn').setAttribute('aria-expanded',o); };
document.addEventListener('click',e=>{ if(!dd.contains(e.target)) dd.classList.remove('open'); });
const dr=$('drawer'); $('burger').onclick=()=>{ dr.classList.add('open'); document.body.style.overflow='hidden'; };
function closeDr(){ dr.classList.remove('open'); document.body.style.overflow=''; }
$('dr_x').onclick=closeDr; dr.querySelectorAll('a.l').forEach(a=>a.addEventListener('click',closeDr));
$('top_x').onclick=()=>{ $('top_notice').hidden=true; };

(async()=>{ try{ const d=await getDoc(doc(db,'site','main')); NOTICES=d.exists()?(d.data().notices||[]):[]; render(); }catch(e){} })();

const msg=(k,c)=>{ const m=$('msg'); m.textContent=k; m.className=c; };
$('f').onsubmit=async e=>{
  e.preventDefault();
  const name=$('a_name').value.trim(), cls=$('a_cls').value, phone=loc($('a_phone').value);
  if($('a_web').value) return;
  if(name.length<2||!cls) return msg(t('e1'),'er');
  if(!/^01\d{9}$/.test(phone)) return msg(t('e2'),'er');
  try{ if(Date.now()-(+localStorage.getItem('smc-app')||0)<60000) return msg(t('e3'),'er'); }catch(e){}
  $('send').disabled=true; msg(t('e4'),'ok');
  try{
    const u=await new Promise(r=>{ const off=onAuthStateChanged(auth,x=>{off();r(x);}); });
    if(!u) await signInAnonymously(auth);
    await addDoc(collection(db,'applications'),{name,father:$('a_father').value.trim(),mother:$('a_mother').value.trim(),phone,cls,school:$('a_school').value.trim(),note:$('a_note').value.trim(),status:'pending',ts:Date.now()});
    try{ localStorage.setItem('smc-app',String(Date.now())); }catch(e){}
    $('f').reset(); msg(t('ok').replace('{p}',phone),'ok');
  }catch(er){ msg(t('fail')+' ('+(er.code||er.message)+')','er'); }
  $('send').disabled=false;
};

const rv=[...document.querySelectorAll('.rv')];
if('IntersectionObserver' in window&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
  const io=new IntersectionObserver(es=>es.forEach(x=>{ if(x.isIntersecting){ x.target.classList.add('in'); io.unobserve(x.target); } }),{threshold:.12});
  rv.forEach(el=>io.observe(el));
}else rv.forEach(el=>el.classList.add('in'));
</script>
</body>
</html>
